<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Billing Video Call</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0f766e;--bg:#f0fdfa;--tx:#134e4a;--card:#ffffff;--mut:#5b7f7b;--bd:#cfe8e4;--bad:#b91c1c;--ok:#15803d;--font:'Poppins',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px}
header{background:var(--p);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:17px}
header small{opacity:.85;display:block;font-size:12px}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--card);color:var(--tx)}
textarea{min-height:110px}
button{font:inherit;border:0;border-radius:8px;padding:11px 16px;background:var(--p);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--p);border:1px solid var(--p)}
button.bad{background:var(--bad)}
button.sm{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5}
button{transition:background .12s,color .12s,transform .08s}
button:active,button.pressed{filter:brightness(.72);transform:scale(.96)}
button.sec:active,button.sec.pressed{background:var(--p);color:#fff;filter:none}
.tabs button:active,.tabs button.pressed{background:var(--p);color:#fff;filter:none}
button.busy{background:#d97706!important;color:#fff!important;border-color:#d97706!important;pointer-events:none;filter:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dev{border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:8px;padding:10px;background:var(--card);font-size:13px}
.dev.on{border-left-color:var(--ok)}.dev.login{border-left-color:#d97706}
.dev b{display:block;font-size:14px}
.big{font-size:64px;font-weight:700;text-align:center;letter-spacing:2px;margin:6px 0;font-variant-numeric:tabular-nums}
.warn{background:#fef3c7;color:#92400e;border:2px solid #f59e0b;border-radius:8px;padding:12px;text-align:center;font-weight:700;margin-bottom:12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.msg{color:var(--ok);font-size:14px}
.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
.wrap{overflow-x:auto}
.center{max-width:420px;margin:30px auto}
@media (prefers-reduced-motion:no-preference){.big.low{animation:bl 1s infinite}@keyframes bl{50%{opacity:.4}}}
.call{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:3/4;max-height:60vh;margin:0 auto 12px;max-width:480px}
.remote,.remote video{width:100%;height:100%}.remote video{object-fit:cover}
.local{position:absolute;right:8px;bottom:8px;width:28%;aspect-ratio:3/4;border:2px solid #fff;border-radius:8px;overflow:hidden;background:#222}
.local video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.sc-wa-action{display:inline-block;background:var(--p);color:#fff;font-weight:700;text-decoration:none;border-radius:8px;padding:11px 16px;margin:7px 0}
.sc-wa-action:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
</style>
</head>
<body>
<header><div><b id="hApp">Billing Video Call</b><small id="hTitle"></small></div><button class="sec sm" id="btnOut" style="display:none;color:#fff;border-color:#fff" onclick="logout()">Keluar</button></header>
<main id="app"></main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script>
/* Alamat Apps Script (API) ada di file config.js */

const $ = s => document.querySelector(s);
const THEMES = {
  hijau:['#0f766e','#f0fdfa','#134e4a','#ffffff','#5b7f7b','#cfe8e4'],
  biru:['#1d4ed8','#eff6ff','#1e3a8a','#ffffff','#64748b','#cbd5e1'],
  ungu:['#6d28d9','#f5f3ff','#3b0764','#ffffff','#6b5b95','#ddd6fe'],
  oranye:['#c2410c','#fff7ed','#431407','#ffffff','#8a6a5a','#fed7aa'],
  gelap:['#38bdf8','#0f172a','#e2e8f0','#1e293b','#94a3b8','#334155']
};
const FONTS = {Poppins:"'Poppins',sans-serif",Nunito:"'Nunito',sans-serif",Sistem:"system-ui,sans-serif",Serif:"Georgia,serif"};
let S = {}, CFG = {slotCount:20,warnSec:60}, T = {}, tab = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LB = null, LBT = 0;
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button');
  if (!b || b.disabled) return;
  b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 700);
  LB = b; LBT = Date.now();
}, true);
async function api(action, data = {}) {
  const b = (LB && Date.now() - LBT < 1500 && !['beat', 'devices', 'config'].includes(action)) ? LB : null;
  if (b) b.classList.add('busy');
  try { return await apiRaw(action, data); } finally { if (b) b.classList.remove('busy'); }
}
async function apiRaw(action, data = {}) {
  if (typeof API === 'undefined' || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API))
    throw new Error('Alamat Apps Script belum diisi benar di file config.js (harus diawali https://script.google.com/macros/s/ dan berakhiran /exec).');
  let t;
  try { const r = await fetch(API, {method:'POST', body:JSON.stringify({action, token:S.token, ...data})}); t = await r.text(); }
  catch (e) { throw new Error('Tidak bisa menghubungi server. Periksa koneksi internet.'); }
  let j;
  try { j = JSON.parse(t); }
  catch (e) { throw new Error('Server Apps Script mengirim halaman, bukan data. Pastikan deployment memakai akses "Siapa saja" dan sudah Deploy versi baru.'); }
  if (!j.ok) { if (/Sesi habis|dinonaktifkan/.test(j.error) && S.token) { toLogin(j.error); } throw new Error(j.error); }
  return j;
}
function applyCfg(c) {
  CFG = Object.assign(CFG, c);
  const t = THEMES[CFG.theme] || THEMES.hijau, r = document.documentElement.style;
  ['--p','--bg','--tx','--card','--mut','--bd'].forEach((k, i) => r.setProperty(k, t[i]));
  r.setProperty('--font', FONTS[CFG.font] || FONTS.Poppins);
  $('#hApp').textContent = CFG.appName; $('#hTitle').textContent = CFG.title;
  document.title = CFG.appName;
  document.querySelector('meta[name=theme-color]').content = t[0];
}
function stopTimers() { ringStop(); lkLeave(); clearInterval(T.tick); clearInterval(T.beat); clearInterval(T.poll); if (T.wl) { try { T.wl.release(); } catch(e){} T.wl = null; } }

/* ================= LOGIN ================= */
async function init() {
  let initErr = '';
  try { const j = await api('config'); applyCfg(j.cfg); } catch (e) { initErr = e.message; }
  const R = new URLSearchParams(location.search).get('r');
  if (R) return guestView(R.toUpperCase());
  toLogin(initErr);
}
function toLogin(msg) {
  stopTimers(); S = {slot:S.slot}; S.slot = Number(localStorage.getItem('slot') || 0);
  $('#btnOut').style.display = 'none';
  if (!S.slot) return slotSetup();
  $('#app').innerHTML = `<div class="card center"><h2>Masuk</h2>
  <label for="u">Username</label><input id="u" autocomplete="off" autocapitalize="off">
  <label for="p">Kata sandi</label><input id="p" type="password" autocomplete="off">
  <div class="err" id="e">${esc(msg||'')}</div>
  <button style="width:100%;margin-top:6px" id="bl" onclick="doLogin()">Masuk</button>
  <p class="mut" style="text-align:center">HP nomor ${S.slot} · <a href="#" onclick="slotSetup();return false">ubah</a></p>
  <button class="sec" style="width:100%" onclick="staffLogin()">Pindah akun (pengawas / pemilik)</button></div>`;
  $('#p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
function slotSetup() {
  let o = ''; for (let i = 1; i <= CFG.slotCount; i++) o += `<option>${i}</option>`;
  $('#app').innerHTML = `<div class="card center"><h2>Atur nomor HP ini</h2>
  <p class="mut">Pilih nomor HP (1-${CFG.slotCount}) sesuai label di HP ini. Cukup sekali.</p>
  <select id="sl">${o}</select><button style="width:100%;margin-top:12px" onclick="localStorage.setItem('slot',$('#sl').value);toLogin()">Simpan</button>
  <p class="mut" style="margin-top:12px">Akun pengawas/pemilik bisa masuk tanpa mengatur ini.</p>
  <button class="sec" style="width:100%" onclick="S.slot=0;staffLogin()">Masuk sebagai pengawas/pemilik</button></div>`;
}
function staffLogin() {
  $('#app').innerHTML = `<div class="card center"><h2>Masuk staf</h2>
  <label>Username</label><input id="u" autocapitalize="off"><label>Kata sandi</label><input id="p" type="password">
  <div class="err" id="e"></div><button style="width:100%;margin-bottom:8px" onclick="doLogin(true)">Masuk</button>
  <button class="sec" style="width:100%" onclick="toLogin()">Pindah akun (santri)</button></div>`;
  $('#p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(true); });
  $('#btnOut').style.display = 'none';
}
async function doLogin(staff) {
  const u = $('#u').value.trim(), p = $('#p').value;
  if (!u || !p) { $('#e').textContent = 'Isi username dan kata sandi'; return; }
  try {
    const j = await api('login', {username:u, password:p, slot:staff ? 0 : S.slot});
    S = {...S, token:j.token, role:j.role, nama:j.nama, user:j.user, allowed:j.allowed, ortu:j.ortu};
    $('#btnOut').style.display = '';
    if (j.role === 'santri') santriHome(); else staffHome();
  } catch (e) { $('#e').textContent = e.message; }
}
async function logout() {
  const wasSantri = S.role === 'santri';
  try { await api(wasSantri ? 'end' : 'logout', {reason:'logout'}); } catch (e) {}
  S.token = null; toLogin();
}

/* ================= NADA DERING ================= */
let RB = null;
function ringStart() {
  ringStop();
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), g = a.createGain();
    g.gain.value = 0; g.connect(a.destination);
    [440, 480].forEach(f => { const o = a.createOscillator(); o.frequency.value = f; o.connect(g); o.start(); });
    const me = {a, stop:false, t:0};
    RB = me; let on = false;
    const step = () => {
      if (me.stop) return;
      on = !on; g.gain.value = on ? 0.15 : 0;
      if (on) { try { navigator.vibrate && navigator.vibrate(400); } catch (e) {} }
      me.t = setTimeout(step, on ? 1000 : 1800);
    };
    step();
  } catch (e) {}
}
function ringStop() {
  const r = RB; RB = null;
  if (r) { r.stop = true; clearTimeout(r.t); try { r.a.close(); } catch (e) {} }
}

/* ================= VIDEO (LiveKit) ================= */
let ROOM = null;
function callBox(wait) {
  return `<div class="call"><div id="remote" class="remote"></div><div class="wait" id="wait">${wait}</div><div id="local" class="local"></div></div>
  <div id="net" class="warn" style="display:none"></div>
  <button id="snd" style="display:none;width:100%;margin-bottom:10px" onclick="ROOM&&ROOM.startAudio().then(()=>this.style.display='none')">Ketuk di sini untuk mengaktifkan suara</button>`;
}
function lkNote(msg) { const w = $('#net'); if (w) { w.textContent = msg || ''; w.style.display = msg ? 'block' : 'none'; } }
async function lkEnsureMedia() {   // pulihkan mikrofon/kamera yang mati (mis. setelah pindah ke WhatsApp)
  const room = ROOM; if (!room) return;
  const L = LivekitClient, lp = room.localParticipant;
  try {
    const mic = lp.getTrackPublication(L.Track.Source.Microphone);
    const mt = mic && mic.track && mic.track.mediaStreamTrack;
    if (!mic || !mt || mt.readyState === 'ended' || mic.isMuted) { await lp.setMicrophoneEnabled(false); await lp.setMicrophoneEnabled(true); }
    if (!S.lowNet) {
      const cam = lp.getTrackPublication(L.Track.Source.Camera);
      const ct = cam && cam.track && cam.track.mediaStreamTrack;
      if (!cam || !ct || ct.readyState === 'ended') { const p = await lp.setCameraEnabled(true); lkLocalPreview(p); }
    }
    await room.startAudio();
  } catch (e) {}
}
function lkLocalPreview(p) {
  if (p && p.track) { const v = p.track.attach(); v.muted = true; v.setAttribute('playsinline', ''); const l = $('#local'); if (l) { l.innerHTML = ''; l.appendChild(v); } }
}
async function lkConnect(url, token) {
  await lkLeave();
  const L = LivekitClient;
  S.lowNet = false;
  const room = new L.Room({adaptiveStream:true, dynacast:true,
    audioCaptureDefaults:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1},
    videoCaptureDefaults:{resolution:L.VideoPresets.h360.resolution},
    publishDefaults:{red:true, dtx:false, audioPreset:L.AudioPresets.speech,
      videoEncoding:{maxBitrate:350000, maxFramerate:15}}});
  ROOM = room;
  room.on(L.RoomEvent.TrackSubscribed, t => {
    const el = t.attach();
    el.setAttribute('playsinline', '');
    if (t.kind === 'video') { const r = $('#remote'); if (r) { r.innerHTML = ''; r.appendChild(el); } const w = $('#wait'); if (w) w.style.display = 'none'; }
    else { el.dataset.lk = 1; el.volume = 1; document.body.appendChild(el); }
  });
  room.on(L.RoomEvent.TrackUnsubscribed, t => t.detach().forEach(e => e.remove()));
  room.on(L.RoomEvent.Disconnected, () => { if (ROOM === room && S.onDisc) S.onDisc(); });
  // suara diblokir browser -> tampilkan tombol
  room.on(L.RoomEvent.AudioPlaybackStatusChanged, () => {
    const b = $('#snd'); if (b) b.style.display = room.canPlaybackAudio ? 'none' : 'block';
  });
  room.on(L.RoomEvent.Reconnecting, () => lkNote('Menyambung ulang jaringan...'));
  room.on(L.RoomEvent.Reconnected, () => { lkNote(''); lkEnsureMedia(); });
  // jaringan jelek: matikan kamera dulu agar suara tetap jernih
  room.on(L.RoomEvent.ConnectionQualityChanged, (q, p) => {
    if (p !== room.localParticipant) return;
    if ((q === L.ConnectionQuality.Poor || q === L.ConnectionQuality.Lost) && !S.lowNet) {
      S.lowNet = true; room.localParticipant.setCameraEnabled(false); lkNote('Jaringan lemah: kamera dimatikan sementara agar suara tetap jelas.');
    } else if (S.lowNet && (q === L.ConnectionQuality.Good || q === L.ConnectionQuality.Excellent)) {
      S.lowNet = false; lkNote('');
      room.localParticipant.setCameraEnabled(true).then(lkLocalPreview).catch(() => {});
    }
  });
  await room.connect(url, token);
  try {
    await room.localParticipant.setMicrophoneEnabled(true);
    lkLocalPreview(await room.localParticipant.setCameraEnabled(true));
  } catch (e) { throw new Error('Izinkan akses kamera dan mikrofon di pengaturan browser, lalu coba lagi.'); }
  try { await room.startAudio(); } catch (e) {}
  const b = $('#snd'); if (b) b.style.display = room.canPlaybackAudio ? 'none' : 'block';
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(lkEnsureMedia, 400); });
async function lkLeave() {
  const r = ROOM; ROOM = null;
  if (r) { try { r.disconnect(); } catch (e) {} }
  document.querySelectorAll('audio[data-lk]').forEach(a => a.remove());
}

/* ================= ORANG TUA (tamu) ================= */
async function guestView(code) {
  let nm = '';
  try { nm = (await api('guestPeek', {code})).santri; }
  catch (e) { return guestDone(e.message); }
  $('#app').innerHTML = `<div class="card center" style="text-align:center"><h2>Panggilan video masuk</h2>
  <div class="big" style="font-size:28px;letter-spacing:0">${esc(nm)}</div><p class="mut">sedang menghubungi Anda</p>
  <label for="gn">Nama Anda (boleh dikosongkan)</label><input id="gn" placeholder="Contoh: Bapak Ahmad">
  <div class="err" id="e"></div>
  <button style="width:100%;background:var(--ok);font-size:18px;padding:16px;margin-top:8px" onclick="guestJoin('${esc(code)}')">Terima panggilan</button>
  <p class="mut">Izinkan kamera dan mikrofon saat diminta.</p></div>`;
  ringStart();
}
async function guestJoin(code) {
  ringStop();
  try {
    const j = await api('guestJoin', {code, name:$('#gn').value.trim() || 'Orang tua'});
    $('#app').innerHTML = `<div class="card center" style="max-width:520px"><h2>Bersama ${esc(j.santri)}</h2>${callBox('Menghubungkan...')}
    <button class="bad" style="width:100%" onclick="guestEnd()">Akhiri</button></div>`;
    S.onDisc = () => guestDone('Panggilan berakhir. Terima kasih.');
    await lkConnect(j.url, j.token);
  } catch (e) { if ($('#e')) $('#e').textContent = e.message; else guestDone(e.message); }
}
function guestEnd() { S.onDisc = null; lkLeave(); guestDone('Panggilan selesai. Terima kasih.'); }
function guestDone(m) { S.onDisc = null; lkLeave(); $('#app').innerHTML = `<div class="card center"><h2>${esc(m)}</h2><p class="mut">Anda boleh menutup halaman ini.</p></div>`; }

/* ================= SANTRI ================= */
function santriHome() {
  S.st = 'login';
  $('#app').innerHTML = `<div class="card center"><h2>Halo, ${esc(S.nama)}</h2>
  <p class="mut">Saldo durasi tersedia: <b>${Math.floor(S.allowed/60)} menit ${S.allowed%60?S.allowed%60+' detik':''}</b></p>
  <label for="no">Nomor WhatsApp orang tua / keluarga</label>
  <input id="no" inputmode="tel" placeholder="contoh: 628123456789" value="${esc(S.ortu||'')}">
  <div class="err" id="e"></div>
  <button style="width:100%;margin-top:6px" onclick="siapkan()">Mulai video call</button>
  <p class="mut">Aplikasi membuat ruang, lalu Anda mengirim link ke WhatsApp orang tua. Timer mulai otomatis saat orang tua masuk.</p></div>`;
  startBeat();
}
async function siapkan() {
  try {
    const no = $('#no').value;
    const j = await api('prepare', {nomor:no});
    S.nomor = no; S.code = j.code; S.st = 'ready'; S.readyMin = j.readyMin;
    $('#app').innerHTML = `<div class="card center" style="max-width:520px">${callBox('Menunggu orang tua masuk...')}<div id="info"></div></div>`;
    showReady();
    ringStart();
    S.onDisc = reconnect;
    await lkConnect(j.url, j.token);
    // Tidak mengganggu koneksi LiveKit apabila Firebase belum siap.
    api('sendInvite').then(x => {
      const el = $('#scPush');
      if (el) el.textContent = x.status === 'sent' ? 'Notifikasi SantriCall dikirim ke ' + x.sent + ' HP orang tua.'
        : x.status === 'unpaired' ? 'HP orang tua belum dipasangkan ke SantriCall. Kirim link via WhatsApp.'
        : x.status === 'url_missing' ? 'Alamat publik Billing belum diatur pemilik. Gunakan WhatsApp.'
        : 'Notifikasi APK belum terkirim (' + x.status + '). Gunakan WhatsApp.';
    }).catch(e => { const el=$('#scPush'); if (el) el.textContent='Notifikasi APK gagal: '+e.message+'. WhatsApp tetap tersedia.'; });
  } catch (e) { if ($('#e')) $('#e').textContent = e.message; else alert(e.message); }
}
async function reconnect() {
  if (!S.token || (S.st !== 'ready' && S.st !== 'on')) return;
  try { const j = await api('rejoin'); await lkConnect(j.url, j.token); } catch (e) { toLogin('Koneksi video terputus. Login lagi.'); }
}
function showReady() {
  const link = location.origin + location.pathname + '?r=' + S.code;
  const num = S.nomor.replace(/^\+/, '').replace(/^0/, '62');
  const txt = encodeURIComponent('Assalamualaikum. PANGGILAN VIDEO dari santri ' + S.nama + '. Mohon SEGERA klik link ini untuk menerima panggilan: ' + link);
  const txt2 = encodeURIComponent('Pengingat: ' + S.nama + ' sedang menunggu panggilan video. Mohon segera klik link ini: ' + link);
  $('#info').innerHTML = `<p id="scPush" class="mut">Pemberitahuan SantriCall disiapkan setelah video tersambung.</p><a href="https://wa.me/${esc(num)}?text=${txt}" target="_blank" rel="noopener"><button style="width:100%;margin-bottom:8px">Kirim link ke WhatsApp orang tua</button></a>
  <button class="sec" style="width:100%;margin-bottom:8px" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(link)}');this.textContent='Tersalin'">Salin link</button>
  <a id="rm" style="display:none" href="https://wa.me/${esc(num)}?text=${txt2}" target="_blank" rel="noopener"><button class="sec" style="width:100%;margin-bottom:8px">Kirim pengingat lagi</button></a>
  <button class="sec sm" style="margin-bottom:8px" onclick="ringStop()">Bisukan nada tunggu</button>
  <p class="mut">Ruang ditutup otomatis jika tidak ada yang masuk dalam ${S.readyMin} menit. Timer mulai saat orang tua masuk.</p>
  <button class="sec" style="width:100%" onclick="selesai('dibatalkan santri')">Batalkan</button>`;
  setTimeout(() => { const e = $('#rm'); if (e && S.st === 'ready') e.style.display = 'block'; }, 30000);
}
function goOn(remaining) {
  ringStop();
  S.st = 'on'; S.endAt = Date.now() + remaining*1000; S.warned = false;
  $('#info').innerHTML = `<div id="wb"></div><div class="mut" style="text-align:center">Sisa Durasi Video Call</div><div class="big" id="cd">--:--</div>
  <button class="bad" style="width:100%" onclick="selesai('selesai oleh santri')">Akhiri panggilan</button>`;
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => T.wl = w); } catch (e) {}
  clearInterval(T.tick);
  T.tick = setInterval(() => {
    const left = Math.ceil((S.endAt - Date.now())/1000);
    if (left <= 0) { clearInterval(T.tick); selesai('waktu habis'); return; }
    const el = $('#cd'); if (!el) return;
    el.textContent = String(Math.floor(left/60)).padStart(2,'0') + ':' + String(left%60).padStart(2,'0');
    el.classList.toggle('low', left <= CFG.warnSec);
    if (left <= CFG.warnSec && !S.warned) { S.warned = true; warn(left); }
  }, 500);
}
function warn(left) {
  $('#wb').innerHTML = `<div class="warn" role="alert">Sisa durasi ${left >= 50 ? 'sekitar 1 menit' : left+' detik'}. Segera selesaikan pembicaraan.</div>`;
  try { navigator.vibrate && navigator.vibrate([400,200,400,200,400]); } catch (e) {}
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator();
    o.connect(a.destination); o.frequency.value = 880; o.start(); setTimeout(() => o.stop(), 700);
  } catch (e) {}
}
function startBeat() {
  clearInterval(T.beat);
  T.beat = setInterval(async () => {
    try {
      const j = await api('beat');
      if (j.end) return toLogin(j.reason);
      if (j.status === 'on') { if (S.st !== 'on') goOn(j.remaining); else S.endAt = Date.now() + j.remaining*1000; }
    } catch (e) {}
  }, 8000);
}
async function selesai(why) {
  S.onDisc = null;
  try { await api('end', {reason:why}); } catch (e) {}
  S.token = null; toLogin(why === 'waktu habis' ? 'Saldo durasi habis. Silakan top up sebelum menelepon kembali.' : 'Sesi selesai.');
}
/* saat timer berjalan, aplikasi disembunyikan = sesi mati */
function kill(reason) {
  if (S.role === 'santri' && S.token && S.st === 'on') {
    S.onDisc = null;
    navigator.sendBeacon(API, JSON.stringify({action:'end', token:S.token, reason}));
    S.token = null; toLogin('Sesi berakhir karena aplikasi disembunyikan. Login lagi dari awal.');
  }
}

let TK = {members:[], top10:[], rate:5000, minutes:10};
const tkRp = n => 'Rp' + (Number(n)||0).toLocaleString('id-ID');
const tkNum = n => (Number(n)||0).toLocaleString('id-ID', {maximumFractionDigits:2});
const tkPendingKey = 'sc_token_pending_v1';
function tkPending() {
  try { return JSON.parse(sessionStorage.getItem(tkPendingKey) || 'null'); }
  catch (_) { return null; }
}
function tkSavePending(p) { sessionStorage.setItem(tkPendingKey, JSON.stringify(p)); }
function tkClearPending() { sessionStorage.removeItem(tkPendingKey); }
function tkNewId() {
  if (crypto.randomUUID) return 'TK' + crypto.randomUUID().replace(/-/g, '');
  const a = new Uint8Array(20); crypto.getRandomValues(a);
  return 'TK' + Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
}
async function tkGetMaster() {
  const j = await api('tokenMaster', {sort:'nama'});

  TK.rate = Number(j.hargaPaket);
  TK.minutes = Number(j.menitPaket);

  return j;
}

function tkFilterChoice() {
  const s = $('#tkMember'); if (!s) return;
  const keep = s.value;
  const q = ($('#tkCari')?.value || '').trim().toLowerCase();
  const list = TK.members.filter(x => !q || x.nama.toLowerCase().includes(q) || x.username.toLowerCase().includes(q));

    `<option value="${esc(x.username)}">${esc(x.nama)} (${esc(x.username)}) — ${tkNum(x.token)} token</option>`

function tkPickAmount(n) { if ($('#tkAmount')) { $('#tkAmount').value = String(TK.rate * n); tkQuote(); } }
function tkQuote() {
  const el = $('#tkQuote'), btn = $('#tkCommit'); if (!el || !btn) return;
  const user = TK.members.find(x => x.username === $('#tkMember')?.value);
  const amount = Number($('#tkAmount')?.value || 0);
  const good = user && Number.isSafeInteger(amount) && amount >= 100 &&
    amount <= 5000000 && amount % TK.rate === 0;
  if (!good) {
    el.textContent = 'Pilih santri dan nominal yang merupakan kelipatan ' + tkRp(TK.rate) + '.';
    btn.disabled = true; return;
  }
  const added = (amount / TK.rate) * TK.minutes;
  el.innerHTML = `<b>${esc(user.nama)}</b><br>Tarif: ${tkRp(TK.rate)} = ${tkNum(TK.minutes)} token<br>
  Pembelian: <b>${tkRp(amount)}</b> = <b>${tkNum(added)} token / ${tkNum(added)} menit</b><br>

  if (!user || !Number.isSafeInteger(nominal) || nominal < 100 ||
      nominal > 5000000 || nominal % TK.rate !== 0) return toast('tkMsg','Periksa santri dan nominal.',1);
  if (tkPending()) return tkShowPending();
  const minutes = nominal / TK.rate * TK.minutes;
  if (!confirm('Pembayaran ' + tkRp(nominal) + ' dari ' + user.nama + ' SUDAH DITERIMA?\n\nTambahkan ' + tkNum(minutes) + ' token / menit?')) return;

async function dlPdf(id) {
  try {
    const j = await api('backupPdf', {id});
    const bin = atob(j.b64), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([a], {type:'application/pdf'}));
    const l = document.createElement('a'); l.href = url; l.download = j.name; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  } catch (e) { alert(e.message); }
}

async function scMakeActivation() {
  const info = $('#scAktInfo'), box = $('#scAktActions');
  if (!info || !box) return;
  box.replaceChildren();
  const nomor = ($('#scAktNomor')?.value || '').trim();
  if (!nomor) { info.textContent = 'Isi nomor WhatsApp orang tua terlebih dahulu.'; return; }
  info.textContent = 'Membuat undangan satu kali pakai...';
  try {
    const j = await api('createParentActivation', {nomor});
    const wa = new URL(String(j.waUrl || ''));
    if (wa.protocol !== 'https:' || wa.hostname !== 'wa.me' || !/^\/62\d{8,13}$/.test(wa.pathname) || !wa.searchParams.has('text')) {
      throw new Error('Alamat WhatsApp dari server tidak valid.');
    }
    const link = document.createElement('a');
    link.href = wa.href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.className = 'sc-wa-action';
    link.textContent = 'Buka WhatsApp untuk mengirim undangan';
    const note = document.createElement('p');
    note.className = 'mut';
    note.textContent = 'Tautan berlaku 60 menit dan hanya sekali pakai. Kirim hanya ke nomor orang tua yang tepat.';
    box.replaceChildren(link, note);
    info.textContent = 'Undangan berhasil dibuat untuk ' + String(j.nomor || nomor) + '. Tekan tautan WhatsApp di bawah dan kirim pesannya.';
  } catch (e) {
    info.textContent = 'Gagal membuat undangan: ' + e.message;
  }
}

async function scLoadDevices() {
  const el = $('#scDevices');
  if (!el) return;
  el.textContent = 'Memuat daftar HP orang tua...';
  try {
    const j = await api('listParentDevices');
    const devices = j.devices || [];
    if (!devices.length) {
      el.textContent = 'Belum ada perangkat orang tua yang dipasangkan.';
      return;
    }
    // Teks dari database di-escape sebelum dimasukkan ke HTML.
    // Install ID divalidasi, agar tidak menjadi kode dari data luar.
    const validId = id => /^[0-9a-f-]{36}$/i.test(String(id));
    el.innerHTML = '<table><thead><tr><th>Nomor WA</th><th>Status</th><th>Terakhir update</th><th>Aksi pemilik</th></tr></thead><tbody>' +
      devices.map(d => {
        const id = String(d.installId || '');
        const safeId = esc(id);
        const active = !!d.aktif;
        const action = !validId(id) ? '<span class="mut">ID perangkat tidak valid</span>' :
          (active ?
            `<button class="sm sec" type="button" onclick="scTest('${safeId}')">Tes Notifikasi</button> ` +
            `<button class="sm bad" type="button" onclick="scUnpair('${safeId}')">Nonaktifkan</button> ` :
            `<button class="sm" type="button" onclick="scReactivate('${safeId}')">Aktifkan Kembali</button> `) +
          `<button class="sm sec" type="button" onclick="scEditNumber('${safeId}')">Edit Nomor</button>`;
        return `<tr><td>${esc(d.nomor)}</td><td><b style="color:${active ? 'var(--ok)' : 'var(--bad)'}">${active ? 'Aktif' : 'Nonaktif'}</b></td>` +
          `<td>${esc(d.updated)}</td><td style="min-width:210px;white-space:normal">${action}</td></tr>`;
      }).join('') + '</tbody></table>';
    // Data terbaru juga disimpan hanya di memori saat sesi pemilik aktif.
    SC_PARENT_UI_DEVICES = devices.map(d => ({
      installId: String(d.installId || ''),
      nomor: String(d.nomor || ''),
      aktif: !!d.aktif
    }));
  } catch (e) {

/* ================= BACKUP DATABASE LENGKAP =================
 * Hanya tampilan pemilik. Server memverifikasi role pemilik lagi.
 * Semua arsip tetap tersimpan privat di Drive; tidak ada fungsi restore otomatis.
 */
let SC_DB_UI_BUSY = false;

function scDbUiMessage(message, error = false) {
  const target = $('#scdbMessage');
  if (!target) return;
  target.textContent = String(message || '');
  target.style.color = error ? 'var(--bad)' : 'var(--ok)';
}

function scDbUiTrustedUrl(raw, type) {
  try {
    const parsed = new URL(String(raw || ''));
    if (parsed.protocol !== 'https:') return '';
    if (type === 'folder') {
      if (parsed.hostname !== 'drive.google.com' || !/^\/drive\/folders\/[A-Za-z0-9_-]+\/?$/.test(parsed.pathname)) return '';
    } else {
      if (!['docs.google.com','drive.google.com'].includes(parsed.hostname)) return '';
      if (!/^[A-Za-z0-9_-]{10,}$/.test(parsed.pathname.split('/').filter(Boolean).find(x => /^[A-Za-z0-9_-]{20,}$/.test(x)) || '')) return '';
    }
    return parsed.href;
  } catch (_) { return ''; }
}

function scDbUiMakeLink(raw, label, type = 'file') {
  const safeUrl = scDbUiTrustedUrl(raw, type);
  if (!safeUrl) return document.createTextNode('Tautan arsip tidak valid');
  const a = document.createElement('a');
  a.href = safeUrl;
  a.textContent = label;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  return a;
}

/* ============ MODE PEMELIHARAAN: API KHUSUS PEMILIK ============
 * Menampilkan status asli dari server; status tidak disimpan di browser.
 * Tidak ada operasi restore database dalam tombol-tombol berikut.
 */
let SC_MT_UI_BUSY = false;
let SC_MT_UI_STATE = null;
function scMtUiMessage(text, isError = false) {
  const el = $('#scmtMessage');
  if (!el) return;
  el.className = isError ? 'err' : 'msg';
  el.textContent = text || '';
}
function scMtUiButtons() {
  const on = $('#scmtOnBtn'), off = $('#scmtOffBtn'), refresh = $('#scmtRefreshBtn');
  if (!on || !off || !refresh) return;
  const st = SC_MT_UI_STATE;
  const slots = st ? Number(st.slotBelumIdle) : NaN;
  const pending = st ? Number(st.transaksiBerjalan) : NaN;
  on.disabled = SC_MT_UI_BUSY || !st || st.aktif ||
    !Number.isFinite(slots) || !Number.isFinite(pending) || slots !== 0 || pending !== 0;
  off.disabled = SC_MT_UI_BUSY || !st || !st.aktif;
  refresh.disabled = SC_MT_UI_BUSY;
}
function scMtUiRender(st) {
  if (!$('#scmtCard')) return;
  SC_MT_UI_STATE = st;
  // Status penyelamatan tidak boleh digunakan setelah perubahan mode.
  if (typeof scRsUiInvalidate === 'function') scRsUiInvalidate();
  if (typeof scPlUiMaintenanceChanged === 'function') scPlUiMaintenanceChanged(st);
  const status = $('#scmtStatus'), details = $('#scmtDetails');
  status.className = st.aktif ? 'warn' : 'msg';
  status.textContent = st.aktif ?
    'MODE PEMELIHARAAN AKTIF — transaksi dan panggilan baru diblokir.' :
    'MODE NORMAL — Billing bisa digunakan seperti biasa.';
  const slots = Number(st.slotBelumIdle);
  const pending = Number(st.transaksiBerjalan);
  const parts = [
    'Slot belum idle: ' + (Number.isFinite(slots) ? slots : 'tidak diketahui'),
    'Transaksi berjalan: ' + (Number.isFinite(pending) ? pending : 'tidak diketahui')
  ];
  if (st.aktif) {
    parts.push('Aktif sejak: ' + String(st.sejak || '-'));
    parts.push('Diaktifkan oleh: ' + String(st.oleh || '-'));
  }
  details.textContent = parts.join(' | ');
  scMtUiButtons();
}
async function scMtUiRefresh() {
  if (S.role !== 'pemilik' || !$('#scmtCard') || SC_MT_UI_BUSY) return;
  SC_MT_UI_BUSY = true;
  scMtUiButtons();
  const status = $('#scmtStatus');
  status.className = 'mut';
  status.textContent = 'Memeriksa status langsung dari server...';
  try {
    const result = await apiRaw('maintenanceStatus');
    if (tab !== 'Pengaturan' || !$('#scmtCard')) return;
    scMtUiRender(result);
    scMtUiMessage('Status berhasil diperbarui.');
  } catch (e) {
    SC_MT_UI_STATE = null;
    if (tab === 'Pengaturan' && $('#scmtStatus')) {
      status.className = 'err';
      status.textContent = 'Status tidak dapat diperiksa.';
      $('#scmtDetails').textContent = '';
      scMtUiMessage('Gagal memuat status: ' + e.message, true);
    }
  } finally {
    SC_MT_UI_BUSY = false;
    scMtUiButtons();
  }
}
async function scMtUiToggle(enable) {
  if (S.role !== 'pemilik' || !$('#scmtCard') || SC_MT_UI_BUSY || !SC_MT_UI_STATE) return;
  const st = SC_MT_UI_STATE;
  if (enable) {
    if (st.aktif) return;
    if (Number(st.slotBelumIdle) !== 0 || Number(st.transaksiBerjalan) !== 0) {
      scMtUiMessage('Belum dapat mengaktifkan: masih ada slot atau transaksi berjalan.', true);
      return;
    }
    const value = prompt('Semua santri sudah keluar dan tidak ada transaksi berjalan?\n\nKetik AKTIFKAN untuk menutup sementara panggilan, Top Up, dan perubahan data.');
    if (value !== 'AKTIFKAN') return;
  } else {
    if (!st.aktif) return;
    if (!confirm('Nonaktifkan Mode Pemeliharaan dan buka kembali akses Billing untuk santri dan operator? Pastikan tidak ada proses pemulihan yang sedang berjalan.')) return;
  }
  SC_MT_UI_BUSY = true;
  scMtUiButtons();
  scMtUiMessage(enable ? 'Mengaktifkan mode pemeliharaan...' : 'Menonaktifkan mode pemeliharaan...');
  try {
    const result = await apiRaw(enable ? 'maintenanceOn' : 'maintenanceOff');
    if (tab !== 'Pengaturan' || !$('#scmtCard')) return;
    scMtUiRender(result);
    scMtUiMessage(enable ?
      'SUKSES: mode pemeliharaan aktif. Panggilan dan transaksi baru diblokir.' :
      'SUKSES: mode pemeliharaan nonaktif. Billing kembali normal.');
  } catch (e) {
    scMtUiMessage('Perubahan gagal: ' + e.message + ' Klik Perbarui status untuk memastikan kondisi server.', true);
    SC_MT_UI_STATE = null; // Jangan tawarkan tombol berbahaya jika keadaan server belum pasti.
  } finally {
    SC_MT_UI_BUSY = false;
    scMtUiButtons();
  }
}
function scMtUiOn() { return scMtUiToggle(true); }
function scMtUiOff() { return scMtUiToggle(false); }

/* ========== BACKUP PENYELAMATAN: 3 API PEMILIK ============
 * dbRescueCheck, dbRescueCreate, dbRescueVerifyLast.
 * Ini hanya menyalin dan memeriksa cadangan; tidak menimpa database aktif.
 * Tombol create memerlukan check terbaru dan server tetap memeriksa ulang.
 */
let SC_RS_UI_BUSY = false;
let SC_RS_UI_READY = false;
let SC_RS_UI_LAST_CHECK_AT = 0;
const SC_RS_UI_CHECK_MAX_AGE = 60000;

function scRsUiMessage(message, error = false) {
  const el = $('#screscueMessage');
  if (!el) return;
  el.textContent = String(message || '');
  el.className = error ? 'err' : 'mut';
}
function scRsUiInvalidate() {
  SC_RS_UI_READY = false;
  SC_RS_UI_LAST_CHECK_AT = 0;
  const status = $('#screscueStatus');
  const details = $('#screscueDetails');
  if (status) {
    status.className = 'mut';
    status.textContent = 'Status kesiapan perlu diperiksa ulang. Klik Periksa Kesiapan.';
  }
  if (details) details.textContent = '';
  scRsUiButtons();
}
function scRsUiButtons() {
  const check = $('#screscueCheckBtn');
  const create = $('#screscueCreateBtn');
  const verify = $('#screscueVerifyBtn');
  if (!check || !create || !verify) return;
  check.disabled = SC_RS_UI_BUSY;
  create.disabled = SC_RS_UI_BUSY || !SC_RS_UI_READY ||
    (Date.now() - SC_RS_UI_LAST_CHECK_AT > SC_RS_UI_CHECK_MAX_AGE);
  verify.disabled = SC_RS_UI_BUSY;
}
function scRsUiSetBusy(busy) {
  SC_RS_UI_BUSY = !!busy;
  scRsUiButtons();
}
function scRsUiResult(title, detail, url) {
  const target = $('#screscueResult');
  if (!target) return;

  const heading = document.createElement('strong');
  heading.textContent = String(title || '');
  target.appendChild(heading);
  const p = document.createElement('p');
  p.className = 'mut';
  p.textContent = String(detail || '');
  target.appendChild(p);
  if (url) {
    const link = scDbUiMakeLink(url, 'Buka arsip penyelamatan di Google Drive');
    target.appendChild(link);
  }
}
function scRsUiRenderCheck(check) {
  const status = $('#screscueStatus');
  const details = $('#screscueDetails');
  if (!status || !details) return;
  const safe = check.siap === true &&
    check.modePemeliharaan === true &&
    Number(check.slotBelumIdle) === 0 &&
    Number(check.transaksiBerjalan) === 0;
  SC_RS_UI_READY = safe;
  SC_RS_UI_LAST_CHECK_AT = Date.now();
  status.className = safe ? 'msg' : 'warn';
  status.textContent = safe ?
    'SIAP — backup penyelamatan dapat dibuat.' :
    'BELUM SIAP — periksa kondisi pemeliharaan dan aktivitas Billing.';
  details.textContent = [
    'Mode Pemeliharaan: ' + (check.modePemeliharaan === true ? 'AKTIF' : 'NONAKTIF'),
    'Slot belum idle: ' + String(check.slotBelumIdle ?? '-'),
    'Transaksi berjalan: ' + String(check.transaksiBerjalan ?? '-'),
    'Jumlah sheet: ' + String(check.jumlahSheet ?? '-')
  ].join(' | ');
  scRsUiMessage(String(check.pesan || (safe ? 'Siap.' : 'Belum siap.')), !safe);
  scRsUiButtons();
}
async function scRsUiCheck() {
  if (S.role !== 'pemilik' || tab !== 'Pengaturan' || !$('#screscueCard') || SC_RS_UI_BUSY) return;
  scRsUiInvalidate();
  scRsUiSetBusy(true);
  const status = $('#screscueStatus');
  status.className = 'mut';
  status.textContent = 'Memeriksa Mode Pemeliharaan, slot, dan transaksi di server...';
  try {
    const result = await apiRaw('dbRescueCheck');
    if (tab !== 'Pengaturan' || !$('#screscueCard')) return;
    scRsUiRenderCheck(result);
  } catch (error) {
    scRsUiInvalidate();
    if (tab === 'Pengaturan' && $('#screscueStatus')) {
      status.className = 'err';
      status.textContent = 'Kesiapan belum dapat diverifikasi.';
      $('#screscueDetails').textContent = '';
      scRsUiMessage('Gagal memeriksa kesiapan: ' + error.message, true);
    }
  } finally {
    scRsUiSetBusy(false);
  }
}
async function scRsUiCreate() {
  if (S.role !== 'pemilik' || tab !== 'Pengaturan' || !$('#screscueCard') || SC_RS_UI_BUSY || !SC_RS_UI_READY) return;
  if (Date.now() - SC_RS_UI_LAST_CHECK_AT > SC_RS_UI_CHECK_MAX_AGE) {
    scRsUiInvalidate();
    scRsUiMessage('Pemeriksaan kesiapan kedaluwarsa. Klik Periksa Kesiapan lagi.', true);
    return;
  }
  scRsUiInvalidate();
  scRsUiSetBusy(true);
  scRsUiMessage('Memeriksa ulang kesiapan sebelum membuat salinan...');
  try {
    const check = await apiRaw('dbRescueCheck');
    if (tab !== 'Pengaturan' || !$('#screscueCard')) return;
    scRsUiRenderCheck(check);
    if (!SC_RS_UI_READY) {
      scRsUiMessage('Backup dibatalkan: ' + String(check.pesan || 'Mode atau transaksi belum aman.'), true);
      return;
    }
    if (!confirm('Buat BACKUP PENYELAMATAN sekarang?\n\nSeluruh database akan disalin ke Google Drive dan diverifikasi. Database aktif tidak diubah. Mode Pemeliharaan tetap AKTIF setelah selesai.')) return;
    scRsUiMessage('Membuat dan memverifikasi backup penyelamatan. Mohon jangan menutup halaman ini selama permintaan berlangsung.');
    const result = await apiRaw('dbRescueCreate');
    if (tab !== 'Pengaturan' || !$('#screscueCard')) return;
    if (result.berhasil !== true) throw new Error(String(result.pesan || 'Server tidak menyatakan backup berhasil'));
    scRsUiResult(result.status || 'BACKUP PENYELAMATAN SUKSES',
      'Arsip: ' + String(result.namaFile || '-') +
      ' | Waktu: ' + String(result.waktu || '-') +
      ' | Sheet: ' + String(result.jumlahSheet ?? '-') +
      ' | Sel diperiksa: ' + String(result.jumlahSelDiperiksa ?? '-') +
      ' | Database asli tidak diubah.', result.url);
    scRsUiMessage('Backup penyelamatan berhasil dibuat dan lolos verifikasi. Mode Pemeliharaan masih aktif.');
    // Segarkan daftar arsip dan status, tetapi jangan otomatis menonaktifkan pemeliharaan.
    scDbBackupUiRefresh();
    scRcUiLoadArchives();
  } catch (error) {
    scRsUiMessage('Backup penyelamatan gagal atau belum pasti: ' + error.message +
      '. Periksa daftar arsip / verifikasi terakhir sebelum mengulang.', true);
  } finally {
    scRsUiInvalidate();
    scRsUiSetBusy(false);
  }
}
async function scRsUiVerify() {
  if (S.role !== 'pemilik' || tab !== 'Pengaturan' || !$('#screscueCard') || SC_RS_UI_BUSY) return;
  scRsUiSetBusy(true);

      ' | Sel diperiksa: ' + String(result.jumlahSelDiperiksa ?? '-') +

    scRsUiSetBusy(false);

    scDbUiMessage('Pemeriksaan selesai. Ini hanya pemeriksaan, bukan pemulihan data.');
  } catch (e) {
    if ($('#scdbInspect')) box.textContent = 'Gagal memeriksa arsip: ' + e.message;
    scDbUiMessage('Pemeriksaan arsip gagal: ' + e.message, true);
  }
}

/* ================= PEMULIHAN DATABASE - MODE AMAN =================
 * Hanya untuk pemilik, dibatasi ulang oleh needOwner(s) di server.
 * Tidak ada endpoint yang menimpa spreadsheet aktif.
 */
let SC_RC_UI_BUSY = false;
let SC_RC_UI_PREVIEW_ID = '';

function scRcUiMessage(message, error = false) {
  const target = $('#scrcMessage');
  if (!target) return;
  target.textContent = String(message || '');
  target.style.color = error ? 'var(--bad)' : 'var(--mut)';
}

function scRcUiSetBusy(busy) {
  SC_RC_UI_BUSY = !!busy;
  const sel = $('#scrcBackup');
  const reload = $('#scrcReloadBtn');
  const preview = $('#scrcPreviewBtn');
  const prepare = $('#scrcPrepareBtn');
  if (sel) sel.disabled = busy;
  if (reload) reload.disabled = busy;
  const valid = sel && /^[A-Za-z0-9_-]{10,}$/.test(sel.value);
  if (preview) preview.disabled = busy || !valid;
  if (prepare) prepare.disabled = busy || !valid || SC_RC_UI_PREVIEW_ID !== sel.value;
}

function scRcUiSelectionChanged() {
  SC_RC_UI_PREVIEW_ID = '';
  const box = $('#scrcPreview');
  const prepared = $('#scrcPrepared');
  if (box) box.replaceChildren();
  if (prepared) prepared.replaceChildren();
  scRcUiMessage('Pilih Periksa sebelum pemulihan untuk melihat kondisi arsip.');
  scRcUiSetBusy(SC_RC_UI_BUSY);
}

async function scRcUiLoadArchives() {
  const sel = $('#scrcBackup');
  if (!sel || S.role !== 'pemilik' || SC_RC_UI_BUSY) return;
  const oldId = sel.value;
  scRcUiSetBusy(true);
  scRcUiMessage('Memuat arsip cadangan untuk pemeriksaan...');
  try {
    const result = await apiRaw('dbBackupList');
    if (tab !== 'Pengaturan' || !$('#scrcBackup')) return;
    const list = Array.isArray(result.items) ? result.items : [];
    const choices = [new Option('Pilih arsip database...', '')];
    list.forEach(item => {
      const id = String(item.id || '');
      if (!/^[A-Za-z0-9_-]{10,}$/.test(id)) return;
      const label = String(item.waktu || '-') + ' | ' + String(item.jenis || '-') + ' | ' + String(item.name || 'Backup');
      choices.push(new Option(label, id));
    });
    sel.replaceChildren(...choices);
    if (oldId && choices.some(x => x.value === oldId)) sel.value = oldId;
    else { sel.value = ''; scRcUiSelectionChanged(); }
    scRcUiMessage(list.length ? 'Pilih arsip, lalu klik Periksa sebelum pemulihan.' : 'Belum ada arsip database untuk diperiksa.');
  } catch (e) {
    if ($('#scrcBackup')) scRcUiMessage('Gagal mengambil daftar arsip: ' + e.message, true);
  } finally {
    scRcUiSetBusy(false);
  }
}

function scRcUiText(parent, tag, value, className) {
  const el = document.createElement(tag);
  el.textContent = String(value ?? '');
  if (className) el.className = className;
  parent.appendChild(el);
  return el;
}

function scRcUiTable(rows, headers) {
  const table = document.createElement('table');
  const head = document.createElement('tr');
  headers.forEach(v => scRcUiText(head, 'th', v));
  table.appendChild(head);
  rows.forEach(cells => {
    const tr = document.createElement('tr');
    cells.forEach(v => scRcUiText(tr, 'td', v));
    table.appendChild(tr);
  });
  return table;
}

async function scRcUiPreview() {
  const sel = $('#scrcBackup');
  if (!sel || S.role !== 'pemilik' || SC_RC_UI_BUSY) return;
  const id = sel.value;
  if (!/^[A-Za-z0-9_-]{10,}$/.test(id)) {
    scRcUiMessage('Pilih arsip yang valid terlebih dahulu.', true);
    return;
  }
  SC_RC_UI_PREVIEW_ID = '';
  const box = $('#scrcPreview');
  if (box) box.replaceChildren();
  const prepared = $('#scrcPrepared');
  if (prepared) prepared.replaceChildren();
  scRcUiSetBusy(true);
  scRcUiMessage('Sedang memeriksa arsip, struktur sheet, dan ringkasan transaksi...');
  try {
    const result = await apiRaw('dbRestorePreview', {id});
    if (tab !== 'Pengaturan' || !$('#scrcPreview') || !$('#scrcBackup') || $('#scrcBackup').value !== id) return;
    const view = $('#scrcPreview');
    scRcUiText(view, 'h2', 'Hasil pemeriksaan: ' + String(result.namaBackup || 'Database'));
    scRcUiText(view, 'p', 'Tanggal arsip: ' + String(result.waktuBackup || '-') + ' | Slot belum idle: ' + String(result.slotBelumIdle ?? '-'), 'mut');

    const comparison = Array.isArray(result.perbandingan) ? result.perbandingan : [];
    scRcUiText(view, 'h3', 'Perbandingan jumlah baris');
    view.appendChild(scRcUiTable(comparison.map(r => [
      String(r.sheet || '-'),
      String(r.barisBackup ?? '-'),
      r.barisAktif === null || r.barisAktif === undefined ? 'Tidak ada' : String(r.barisAktif)
    ]), ['Sheet', 'Arsip', 'Database aktif']));

    const token = result.pemeriksaanToken || {};
    scRcUiText(view, 'h3', 'Pemeriksaan riwayat token');
    const fields = [
      ['Jumlah mutasi', 'transaksi'],
      ['Transaksi Top Up', 'topUp'],
      ['Pemakaian', 'pemakaian'],
      ['ID transaksi ganda', 'idGanda'],
      ['Baris transaksi tidak valid', 'barisTidakValid'],
      ['Saldo tidak sesuai dengan mutasi', 'ringkasanTidakSesuai'],
      ['Saldo ringkasan tidak valid', 'ringkasanTidakValid'],
      ['Saldo negatif dari mutasi', 'saldoNegatif']
    ];
    view.appendChild(scRcUiTable(fields.map(([label,key]) => [label, String(token[key] ?? '-')]), ['Pemeriksaan', 'Hasil']));

    const warnings = Array.isArray(result.peringatan) ? result.peringatan : [];
    scRcUiText(view, 'h3', 'Peringatan');
    if (warnings.length) {
      const ul = document.createElement('ul');
      warnings.forEach(w => scRcUiText(ul, 'li', w));
      view.appendChild(ul);
      scRcUiText(view, 'p', 'Periksa semua peringatan tersebut. Salinan uji tidak memperbaiki saldo atau transaksi.', 'err');
    } else {
      scRcUiText(view, 'p', 'Tidak ada peringatan dari pemeriksaan otomatis ini. Tetap verifikasi transaksi dan saldo secara manual sebelum melakukan pemulihan apa pun.', 'mut');
    }
    SC_RC_UI_PREVIEW_ID = id;
    scRcUiMessage('Pemeriksaan selesai. Database aktif tetap tidak berubah. Anda dapat membuat salinan uji.');
  } catch (e) {
    if ($('#scrcPreview')) scRcUiMessage('Pemeriksaan gagal: ' + e.message, true);
  } finally {
    scRcUiSetBusy(false);
  }
}

async function scRcUiPrepare() {
  const sel = $('#scrcBackup');
  if (!sel || S.role !== 'pemilik' || SC_RC_UI_BUSY) return;
  const id = sel.value;
  if (!id || id !== SC_RC_UI_PREVIEW_ID) {
    scRcUiMessage('Periksa arsip yang dipilih terlebih dahulu.', true);
    return;
  }
  if (!confirm('Buat SALINAN UJI dari cadangan terpilih di Google Drive?\n\nTindakan ini TIDAK mengembalikan atau menimpa database Billing aktif.')) return;
  scRcUiSetBusy(true);
  scRcUiMessage('Membuat salinan uji database di Google Drive...');
  try {
    const result = await apiRaw('dbRestorePrepare', {id});
    if (tab !== 'Pengaturan' || !$('#scrcPrepared') || !$('#scrcBackup') || $('#scrcBackup').value !== id) return;
    const box = $('#scrcPrepared');
    box.replaceChildren();
    scRcUiText(box, 'h3', result.berhasil ? 'Salinan uji berhasil dibuat' : 'Hasil pembuatan salinan');
    scRcUiText(box, 'p', String(result.pesan || '') + ' | File: ' + String(result.fileUji || '-'), 'mut');
    const fileLine = document.createElement('p');
    fileLine.appendChild(scDbUiMakeLink(result.url, 'Buka salinan uji di Google Drive'));
    box.appendChild(fileLine);
    const folderLine = document.createElement('p');
    folderLine.appendChild(scDbUiMakeLink(result.folderUrl, 'Buka folder Salinan Uji', 'folder'));
    box.appendChild(folderLine);
    scRcUiMessage('SUKSES: salinan uji dibuat. Spreadsheet Billing aktif tidak berubah.');
  } catch (e) {
    if ($('#scrcPrepared')) scRcUiMessage('Gagal membuat salinan uji: ' + e.message, true);
  } finally {
    scRcUiSetBusy(false);
  }
}


/* ========== RENCANA PEMULIHAN: AUDIT DAN SALINAN AMAN ==========
 * Backend: dbRestorePlanPreview / dbRestorePlanCreate (akses pemilik).
 * API selalu memakai arsip AUTO/MANUAL paling baru; pengguna tidak memilih ID.
 * Backend menjalankan pemeriksaan Mode Pemeliharaan, Rescue, dan konflik ulang.
 * PERINGATAN: Tidak ada API di sini untuk menimpa database aktif.
 */
let SC_PL_UI_BUSY = false;
let SC_PL_UI_PREVIEW_AT = 0;
let SC_PL_UI_LAST_ARCHIVE = '';
const SC_PL_UI_MAX_PREVIEW_AGE = 60000;

function scPlUiStatus(text, isError = false) {
  const el = $('#scplStatus');
  if (!el) return;
  el.className = isError ? 'err' : 'mut';
  el.textContent = String(text || '');
}
function scPlUiMessage(text, isError = false) {
  const el = $('#scplMessage');
  if (!el) return;
  el.className = isError ? 'err' : 'mut';
  el.textContent = String(text || '');
}
function scPlUiClearPreview() {
  SC_PL_UI_PREVIEW_AT = 0;
  SC_PL_UI_LAST_ARCHIVE = '';
  const view = $('#scplPreview');
  if (view) view.replaceChildren();
  const created = $('#scplCreated');
  if (created) created.replaceChildren();
  scPlUiButtons();
}
function scPlUiButtons() {
  const preview = $('#scplPreviewBtn');
  const create = $('#scplCreateBtn');
  if (!preview || !create) return;
  const maintained = SC_MT_UI_STATE && SC_MT_UI_STATE.aktif === true;
  const fresh = SC_PL_UI_PREVIEW_AT > 0 &&
    (Date.now() - SC_PL_UI_PREVIEW_AT <= SC_PL_UI_MAX_PREVIEW_AGE);
  preview.disabled = SC_PL_UI_BUSY || !maintained;
  create.disabled = SC_PL_UI_BUSY || !maintained || !fresh || !SC_PL_UI_LAST_ARCHIVE;
}
function scPlUiMaintenanceChanged(st) {
  if (!$('#scplCard')) return;
  // Any server-side maintenance refresh invalidates the previous audit.
  scPlUiClearPreview();
  scPlUiStatus(st && st.aktif ?
    'Mode Pemeliharaan AKTIF. Anda dapat memeriksa backup AUTO/MANUAL terbaru.' :
    'Mode Pemeliharaan tidak aktif. Aktifkan terlebih dahulu untuk pemeriksaan rencana.');
  scPlUiMessage('');
  scPlUiButtons();
}
function scPlUiReset() {
  SC_PL_UI_BUSY = false;
  scPlUiClearPreview();
  const maintenance = SC_MT_UI_STATE;
  scPlUiStatus(maintenance && maintenance.aktif ?
    'Mode Pemeliharaan terdeteksi aktif. Periksa konflik sebelum membuat rencana.' :
    'Menunggu pemeriksaan Mode Pemeliharaan dari server...');
  scPlUiMessage('');
  scPlUiButtons();
}
function scPlUiDecisionKind(decision) {
  const s = String(decision || '').toUpperCase();
  if (s.indexOf('STOP') === 0 || s.indexOf('BLOKIR') >= 0) return 'stop';
  if (s.indexOf('TIDAK PERLU') === 0) return 'identik';
  return 'tinjau';
}
function scPlUiRenderPreview(result) {
  const view = $('#scplPreview');
  if (!view) return;
  view.replaceChildren();
  const decision = String(result.keputusan || 'PERLU TINJAUAN');
  const kind = scPlUiDecisionKind(decision);
  const heading = scRcUiText(view, 'h3', 'Keputusan: ' + decision);
  heading.className = kind === 'stop' ? 'err' : kind === 'identik' ? 'msg' : 'warn';
  scRcUiText(view, 'p', String(result.penjelasan || 'Jangan menjalankan restore produksi tanpa peninjauan.'), 'mut');
  scRcUiText(view, 'p', 'Sumber: ' + String(result.namaArsip || '-') +
    ' | Waktu arsip: ' + String(result.waktuArsip || '-') +
    ' | Status audit: ' + String(result.statusAudit || '-'), 'mut');
  const metrics = [
    ['Transaksi di database aktif', result.jumlahTransaksiAktif],
    ['Transaksi di arsip', result.jumlahTransaksiArsip],
    ['Transaksi aktif tidak ada di arsip', result.transaksiTidakAdaDiArsip],
    ['ID sama dengan isi berbeda', result.transaksiDenganIdSamaBerbeda],
    ['Transaksi hanya terdapat di arsip', result.transaksiHanyaDiArsip]
  ];
  scRcUiText(view, 'h3', 'Pemeriksaan transaksi');
  view.appendChild(scRcUiTable(metrics.map(([label, value]) => [label, String(value ?? '-')]), ['Pemeriksaan', 'Jumlah']));
  const warnings = Array.isArray(result.peringatan) ? result.peringatan : [];
  scRcUiText(view, 'h3', 'Peringatan audit');
  if (warnings.length) {
    const ul = document.createElement('ul');
    warnings.slice(0, 40).forEach(w => scRcUiText(ul, 'li', w));
    view.appendChild(ul);
    if (warnings.length > 40) scRcUiText(view, 'p', 'Peringatan lain: ' + (warnings.length - 40) + ' item. Periksa laporan di Drive.', 'mut');
  } else {
    scRcUiText(view, 'p', 'Tidak ada peringatan tambahan dalam pemeriksaan ini. Ini bukan izin otomatis untuk restore.', 'mut');
  }
  const sheets = Array.isArray(result.sheets) ? result.sheets : [];
  scRcUiText(view, 'h3', 'Rencana tiap sheet (' + sheets.length + ')');
  view.appendChild(scRcUiTable(sheets.slice(0, 100).map(sh => [
    String(sh.sheet || '-'),
    String(sh.barisAktif ?? '-'),
    String(sh.barisArsip ?? '-'),
    String(sh.nilai || '-'),
    String(sh.rumus || '-'),
    String(sh.tindakan || '-'),
    String(sh.alasan || '-')
  ]), ['Sheet', 'Baris aktif', 'Baris arsip', 'Nilai', 'Rumus', 'Tindakan', 'Alasan']));
  if (sheets.length > 100) scRcUiText(view, 'p', 'Tampilan dibatasi pada 100 sheet pertama.', 'mut');
  scRcUiText(view, 'p', 'Database aktif diubah: ' +
    (result.pemulihanDatabaseAktifDilakukan === false ? 'TIDAK' : 'STATUS BELUM TERKONFIRMASI'), 'mut');
  if (kind === 'stop') {
    scRcUiText(view, 'p', 'STOP: Jangan memulihkan arsip ini ke database aktif. Tombol Buat Salinan Rencana hanya menyimpan dokumen audit.', 'err');
  } else if (kind === 'tinjau') {
    scRcUiText(view, 'p', 'TINJAU MANUAL: Perbedaan harus dikaji sebelum pemulihan produksi.', 'warn');
  } else {
    scRcUiText(view, 'p', 'Data identik dalam cakupan audit: pemulihan tidak diperlukan.', 'mut');
  }
}
async function scPlUiPreview() {
  if (S.role !== 'pemilik' || tab !== 'Pengaturan' || !$('#scplCard') || SC_PL_UI_BUSY) return;
  if (!SC_MT_UI_STATE || SC_MT_UI_STATE.aktif !== true) {
    scPlUiMessage('Aktifkan Mode Pemeliharaan terlebih dahulu.', true);
    return;
  }
  scPlUiClearPreview();
  SC_PL_UI_BUSY = true;
  scPlUiButtons();
  scPlUiStatus('Sedang membaca arsip AUTO/MANUAL terbaru dan membandingkan data...');
  scPlUiMessage('Pemeriksaan ini tidak menimpa database aktif.');
  try {
    const result = await apiRaw('dbRestorePlanPreview');
    if (tab !== 'Pengaturan' || !$('#scplCard')) return;
    if (!result || result.pemulihanDatabaseAktifDilakukan !== false ||
        !result.keputusan || !result.idArsip) {
      throw new Error('Hasil server tidak lengkap atau status keamanan tidak terkonfirmasi.');
    }
    scPlUiRenderPreview(result);
    SC_PL_UI_LAST_ARCHIVE = String(result.idArsip);
    SC_PL_UI_PREVIEW_AT = Date.now();
    scPlUiStatus('Audit selesai. Keputusan: ' + String(result.keputusan));
    scPlUiMessage('Anda boleh membuat SALINAN RENCANA untuk dokumentasi, termasuk jika keputusan STOP. Ini bukan restore.');
  } catch (error) {
    scPlUiClearPreview();
    if (tab === 'Pengaturan' && $('#scplCard')) {
      scPlUiStatus('Audit rencana belum berhasil.', true);
      scPlUiMessage('Gagal memeriksa: ' + error.message +
        '. Pastikan Mode Pemeliharaan aktif dan tidak ada transaksi berjalan.', true);
    }
  } finally {
    SC_PL_UI_BUSY = false;
    scPlUiButtons();
  }
}
async function scPlUiCreate() {
  if (S.role !== 'pemilik' || tab !== 'Pengaturan' || !$('#scplCard') || SC_PL_UI_BUSY) return;
  if (!SC_MT_UI_STATE || !SC_MT_UI_STATE.aktif || !SC_PL_UI_LAST_ARCHIVE ||
      !SC_PL_UI_PREVIEW_AT || Date.now() - SC_PL_UI_PREVIEW_AT > SC_PL_UI_MAX_PREVIEW_AGE) {
    scPlUiClearPreview();
    scPlUiMessage('Audit sudah tidak berlaku. Klik Periksa Konflik & Keputusan lagi.', true);
    return;
  }
  const accepted = confirm('Buat SALINAN RENCANA pemulihan di Google Drive?\n\n' +
    'Server akan membuat Backup Penyelamatan baru dan memeriksa konflik ulang.\n' +
    'Tindakan ini TIDAK memulihkan atau menimpa database Billing aktif.\n\n' +
    'Status STOP/TINJAU hanya dicatat sebagai laporan, bukan izin restore.');
  if (!accepted) return;
  SC_PL_UI_BUSY = true;
  scPlUiButtons();
  scPlUiMessage('Membuat Rescue dan file rencana. Jangan menekan tombol berulang.');
  const created = $('#scplCreated');
  if (created) created.replaceChildren();
  try {
    const result = await apiRaw('dbRestorePlanCreate');
    if (tab !== 'Pengaturan' || !$('#scplCard')) return;
    if (result.status !== 'RENCANA PEMULIHAN DIBUAT' ||
        result.databaseAktifDiubah !== false || result.restoreProduksiDilakukan !== false) {
      throw new Error('Server tidak memberikan konfirmasi keamanan yang diharapkan. Periksa arsip di Drive.');
    }
    const box = $('#scplCreated');
    scRcUiText(box, 'h3', 'RENCANA PEMULIHAN DIBUAT');
    scRcUiText(box, 'p', 'File: ' + String(result.namaFile || '-') +
      ' | Keputusan: ' + String(result.keputusan || '-') +
      ' | Jumlah sheet: ' + String(result.jumlahSheetRencana ?? '-') +
      ' | Database aktif tidak diubah.', 'mut');
    const links = [
      [result.url, 'Buka file Rencana Pemulihan'],
      [result.rescueUrl, 'Buka Backup Penyelamatan'],
      [result.folderUrl, 'Buka folder Salinan Uji', 'folder']
    ];
    links.forEach(([url, label, type]) => {
      const p = document.createElement('p');
      p.appendChild(scDbUiMakeLink(url, label, type || 'file'));
      box.appendChild(p);
    });
    if (Array.isArray(result.peringatan) && result.peringatan.length) {
      scRcUiText(box, 'p', 'Peringatan: ' + result.peringatan.slice(0, 5).join('; '), 'warn');
    }
    scPlUiStatus('SALINAN RENCANA BERHASIL DIBUAT. Tidak ada restore produksi.');
    scPlUiMessage('Simpan file rencana dan Rescue. Mode Pemeliharaan tetap aktif sampai Anda menonaktifkannya.');
    // Audit lama tidak lagi berlaku untuk operasi berikutnya.
    SC_PL_UI_PREVIEW_AT = 0;
    SC_PL_UI_LAST_ARCHIVE = '';
    scDbBackupUiRefresh();
    scRsUiInvalidate();
  } catch (error) {
    scPlUiMessage('Pembuatan rencana gagal atau belum pasti: ' + error.message +
      '. Periksa folder Google Drive sebelum mengulang.', true);
    SC_PL_UI_PREVIEW_AT = 0;
    SC_PL_UI_LAST_ARCHIVE = '';
  } finally {
    SC_PL_UI_BUSY = false;
    scPlUiButtons();
  }
}

async function saveDev(n) { try { await api('saveDevice', {slot:n, nama:$('#dn'+n).value}); alert('Tersimpan'); } catch (e) { alert(e.message); } }
async function testLk() { toast('tm','Menguji...'); try { const j = await api('testLk'); toast('tm', j.msg); } catch (e) { toast('tm', e.message, 1); } }
async function backup() { try { const j = await api('backupNow'); toast('bk', j.msg); } catch (e) { toast('bk', e.message, 1); } }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();
